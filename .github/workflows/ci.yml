name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-build:
    name: Test and Build Monorepo
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
      JWT_SECRET: "ci_pipeline_dummy_jwt_secret_key_2026"
      JWT_REFRESH_SECRET: "ci_pipeline_dummy_jwt_refresh_secret_key_2026"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Types
        run: pnpm --filter @campus-food/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter @campus-food/backend prisma:generate

      - name: Run Backend Unit Tests
        run: pnpm --filter @campus-food/backend test

      - name: Build Backend & Web Application
        run: |
          pnpm --filter @campus-food/backend build
          pnpm --filter @campus-food/web build
