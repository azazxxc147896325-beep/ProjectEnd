version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Container
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campus_food_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusfoodpassword2026
      POSTGRES_DB: campus_food_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campus_food_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # NestJS Backend API & WebSocket Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: campus_food_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:campusfoodpassword2026@postgres:5432/campus_food_db?schema=public
      JWT_SECRET: campus_food_jwt_secret_key_change_in_production_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Next.js Web Dashboard (POS, KDS, Analytics, Customer Queue Display)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: campus_food_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
