packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@types/react': '18.3.18'
  '@types/react-dom': '18.3.5'


allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - 'bcryptjs'
  - '@scarf/scarf'
